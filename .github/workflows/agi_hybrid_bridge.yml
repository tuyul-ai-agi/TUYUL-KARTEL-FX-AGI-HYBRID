name: 🐺 AGI Hybrid Reflex–Fusion Bridge

on:
  workflow_dispatch:    # bisa dijalankan manual dari GitHub UI
  push:
    branches:
      - main

jobs:
  agi_bridge:
    name: Run AGI Hybrid Bridge
    runs-on: ubuntu-latest

    env:
      GH_REPO: ${{ secrets.GH_REPO }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 🧩 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧠 Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 🐺 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: ⚡ Run AGI GitHub Bridge
        run: |
          echo "🐺 Running AGI Hybrid Reflex–Fusion Bridge..."
          python github_api_bridge.py
        env:
          GH_REPO: ${{ env.GH_REPO }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

      - name: 📦 Push AGI Log to Repo
        run: |
          echo "Pushing AGI log to Vault..."
          echo "AGI Reflex–Fusion Bridge sync complete at $(date)" > agi_bridge_log.txt
          git config --global user.name "Tuyul Kartel FX Ultra Wolf"
          git config --global user.email "wolf@tuyulkartel.ai"
          git add agi_bridge_log.txt
          git commit -m "🐺 Reflex–Fusion Bridge Sync $(date)"
          git push
