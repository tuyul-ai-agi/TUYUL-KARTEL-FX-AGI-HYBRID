name: 🧠 AGI Hybrid Sync

on:
  push:
    branches: [ main, dev, reflective ]
  schedule:
    - cron: "0 */6 * * *"  # Setiap 6 jam
  workflow_dispatch:

jobs:
  sync-agi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AGI Hybrid Sync
        run: python scripts/sync_hybrid_repo.py

      - name: Commit & Push Vault Sync
        run: |
          git config user.name "AGI Sync Bot"
          git config user.email "agi@tuyulkartel.ai"
          git add vaults/ logs/
          git commit -m "🤖 Auto-sync AGI Hybrid Vaults"
          git push
