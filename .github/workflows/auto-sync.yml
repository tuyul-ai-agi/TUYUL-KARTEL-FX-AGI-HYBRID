name: Auto-Sync to Vaults

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'data/**'
      - 'logs/**'

jobs:
  sync-knowledge-vault:
    name: Sync to Knowledge Vault
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub gitpython

      - name: Sync knowledge data
        env:
          GITHUB_TOKEN: ${{ secrets.VAULT_SYNC_TOKEN }}
          KNOWLEDGE_VAULT_REPO: ${{ secrets.KNOWLEDGE_VAULT_REPO }}
        run: |
          python -c "
          import os
          import json
          from datetime import datetime
          from github import Github
          
          token = os.environ.get('GITHUB_TOKEN')
          repo_name = os.environ.get('KNOWLEDGE_VAULT_REPO')
          
          if token and repo_name:
              g = Github(token)
              repo = g.get_repo(repo_name)
              
              # Create sync metadata
              sync_data = {
                  'timestamp': datetime.utcnow().isoformat(),
                  'source': 'TUYUL-FX-HYBRID',
                  'version': '5.4.0',
                  'sync_type': 'automated'
              }
              
              content = json.dumps(sync_data, indent=2)
              file_path = f'syncs/{datetime.utcnow().strftime(\"%Y%m%d_%H%M%S\")}.json'
              
              try:
                  repo.create_file(
                      file_path,
                      f'Auto-sync from TUYUL-FX-HYBRID at {datetime.utcnow().isoformat()}',
                      content
                  )
                  print(f'Synced to {file_path}')
              except Exception as e:
                  print(f'Sync failed: {e}')
          else:
              print('Skipping: No GitHub token or repo configured')
          "

  sync-journal-vault:
    name: Sync to Journal Vault
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub gitpython

      - name: Sync journal data
        env:
          GITHUB_TOKEN: ${{ secrets.VAULT_SYNC_TOKEN }}
          JOURNAL_VAULT_REPO: ${{ secrets.JOURNAL_VAULT_REPO }}
        run: |
          python -c "
          import os
          import json
          from datetime import datetime
          from github import Github
          
          token = os.environ.get('GITHUB_TOKEN')
          repo_name = os.environ.get('JOURNAL_VAULT_REPO')
          
          if token and repo_name:
              g = Github(token)
              repo = g.get_repo(repo_name)
              
              # Create journal entry
              journal_data = {
                  'timestamp': datetime.utcnow().isoformat(),
                  'source': 'TUYUL-FX-HYBRID',
                  'version': '5.4.0',
                  'entry_type': 'automated_sync',
                  'status': 'operational'
              }
              
              content = json.dumps(journal_data, indent=2)
              date = datetime.utcnow().strftime('%Y-%m-%d')
              file_path = f'journals/{date}/{datetime.utcnow().strftime(\"%H%M%S\")}.json'
              
              try:
                  repo.create_file(
                      file_path,
                      f'Auto-journal from TUYUL-FX-HYBRID at {datetime.utcnow().isoformat()}',
                      content
                  )
                  print(f'Journaled to {file_path}')
              except Exception as e:
                  print(f'Journal failed: {e}')
          else:
              print('Skipping: No GitHub token or repo configured')
          "

  notification:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [sync-knowledge-vault, sync-journal-vault]
    if: always()
    steps:
      - name: Notify completion
        run: |
          echo "Auto-sync workflow completed"
          echo "Knowledge Vault sync: ${{ needs.sync-knowledge-vault.result }}"
          echo "Journal Vault sync: ${{ needs.sync-journal-vault.result }}"
