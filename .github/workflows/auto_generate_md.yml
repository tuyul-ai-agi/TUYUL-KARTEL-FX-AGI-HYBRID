name: Auto Generate Documentation
on:
  push:
    paths:
      - 'core/**'
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Generate Docs
        id: generate
        continue-on-error: true
        run: |
          cd tuyul_fx_agi_hybrid
          if [ -f scripts/generate_docs.py ]; then
            python3 scripts/generate_docs.py
          else
            echo "⚠️ generate_docs.py not found - skipping documentation generation"
            exit 0
          fi
      
      - name: Commit Docs
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "TUYUL AGI BOT"
          git config user.email "agi-bot@tuyul.local"
          git add docs/ || true
          if git diff --cached --quiet; then
            echo "No documentation changes to commit"
          else
            git commit -m "🧠 Auto-generated documentation" || echo "Commit failed"
            git push || echo "Push failed - may need manual intervention"
          fi
