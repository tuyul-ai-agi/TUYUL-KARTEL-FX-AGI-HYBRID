name: 🔁 Hybrid Orchestrator BOT Sync (v5.7.1)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hybrid-sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.HYBRID_REPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - name: 🧠 Run Reflective Cycle
        run: |
          echo "Triggering reflective_update to Knowledge Vault..."
          curl -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/tuyul-ai-agi/tuyul-kartel-fx-knowledge/dispatches \
            -d '{"event_type":"reflective_update","client_payload":{"source":"tuyul-fx-agi-hybrid"}}'
