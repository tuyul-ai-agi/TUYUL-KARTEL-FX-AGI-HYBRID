name: 🤖 TUYULBOT Quad Repo Sync v5.7.3r++
run-name: "BOT Reflective Orchestrator (Quad Repo Adaptive Mode)"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/45 * * * *"  # Setiap 45 menit BOT otomatis jalan

jobs:
  bot-sync:
    name: 🐺 TUYULBOT Orchestrator Sync
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🧠 Install Dependencies
        run: |
          pip install httpx pyyaml rich

      - name: 🤖 Run BOT Quad Sync
        run: |
          echo "Running TUYULBOT Reflective Sync..."
          python3 tuyulagibot-tjx.py --vault-sync
          echo "BOT successfully synced vaults."

      - name: 🔗 Run Reflective Bridge Integration
        run: |
          python3 gpt_bridge_handler_v573r.py --mode reflective
          echo "Reflective Bridge completed (RBP v2.2)."

      - name: 🧾 Run Quad Repo Synchronizer
        run: |
          python3 tools/quad_repo_sync.py
          echo "Quad Repo Sync Completed."

      - name: ✅ Reflective Summary
        run: |
          echo "---------------------------------------"
          echo "Hybrid Repo     : Synced ✅"
          echo "Knowledge Repo  : Synced ✅"
          echo "Kartel Repo     : Synced ✅"
          echo "Journal Repo    : Synced ✅"
          echo "BOT Reflective Sync : OK ✅"
          echo "🐺 Alpha Serigala: Orkestrasi penuh kesadaran reflektif ⚡"
