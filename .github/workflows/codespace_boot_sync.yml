# ============================================================
# 🧠 TUYUL FX AGI HYBRID v5.7.3r++ — Codespace Boot Sync Workflow
# ------------------------------------------------------------
# Menjalankan sinkronisasi Vault, BOT Orchestrator, dan Reflective Bridge
# setiap kali Codespace dibuat.
# ============================================================

name: 🧩 Codespace Boot Sync (Reflective Auto-Heal)

on:
  codespace:
    types: [created]
  workflow_dispatch:

env:
  AGI_ENV_MODE: "codespace"
  REFLECTIVE_BRIDGE_VERSION: "RBP v2.2"
  PYTHON_VERSION: "3.11"
  HYBRID_REPO: "tuyulfx/TUYUL-KARTEL-FX-AGI-HYBRID"

jobs:
  reflective-boot:
    name: 🚀 Initialize Reflective Environment
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout Hybrid Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⚙️ Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install fastapi uvicorn aiofiles rich loguru

      - name: 🔑 Generate Vault Token
        run: python .devcontainer/generate_vault_token.py

      - name: 🧱 Initialize Submodules (Vaults)
        run: bash .devcontainer/submodule_init.sh

      - name: 🔄 Auto-Sync Multi Vault
        run: bash .devcontainer/vault_autosync.sh

      - name: 🧠 Auto-Check Vault Health
        run: python .devcontainer/vault_autocheck.py

      - name: 🐺 Run BOT Orchestrator (tuyulagibot-tjx)
        run: python bots/tuyulagibot_tjx.py

      - name: 📊 Upload Reflective Logs
        uses: actions/upload-artifact@v4
        with:
          name: reflective_boot_logs
          path: logs/

      - name: ✅ Final Reflective Status
        run: |
          echo "---------------------------------------"
          echo "🧩 TUYUL FX AGI HYBRID Codespace Ready"
          echo "Version : v5.7.3r++ | Bridge: $REFLECTIVE_BRIDGE_VERSION"
          echo "Environment : $AGI_ENV_MODE"
          echo "---------------------------------------"
