name: Deploy Reflective Docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Redoc CLI
        run: |
          npm install -g redoc-cli

      - name: Generate Reflective API Docs
        run: |
          mkdir -p docs
          redoc-cli bundle api/openapi_tuyul_fx_v573r.yaml -o docs/index.html

      - name: Deploy Reflective Docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
