name: 📘 Deploy Swagger Docs v5.7.3r++
run-name: "Deploy Reflective API Docs to /docs/v573r++"

on:
  push:
    branches: [ "main" ]
    paths:
      - "openapi/**.yaml"
      - "swagger/**.json"
  workflow_dispatch:

jobs:
  deploy-swagger:
    name: 🚀 Deploy Swagger Docs
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Swagger UI
        run: |
          npm install -g swagger-ui-watcher

      - name: 🧠 Prepare Reflective Swagger Build
        run: |
          mkdir -p docs/v573r++
          cp openapi/*.yaml docs/v573r++/
          echo "version: v5.7.3r++" > docs/v573r++/version.txt

      - name: 🚀 Deploy Swagger Docs
        run: |
          swagger-ui-watcher docs/v573r++/*.yaml --port 8080 --host 0.0.0.0 &
          echo "Swagger Reflective Docs deployed on /docs/v573r++"

      - name: ✅ Reflective Summary
        run: |
          echo "----------------------------------------"
          echo "Swagger Docs Deployed → /docs/v573r++ ✅"
          echo "Version : v5.7.3r++"
          echo "Reflective Bridge Protocol : RBP v2.2"
          echo "🐺 Serigala puas — dokumentasi sinkron reflektif ⚡"
