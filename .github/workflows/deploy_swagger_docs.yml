name: 🧠 Deploy Swagger Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/openapi_tuyul_agi_hybrid_v5.4.4-ultra.yml"
      - "scripts/generate_swagger_ui.py"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: |
          pip install pyyaml
          pip install requests

      - name: 🧠 Generate Swagger UI
        run: python scripts/generate_swagger_ui.py

      - name: 🚀 Deploy Swagger Docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/swagger
          publish_branch: gh-pages
          commit_message: "🧠 Deploy Swagger UI v5.4.4-ULTRA"
