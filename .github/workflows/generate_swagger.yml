name: 🧠 Generate Swagger UI v5.7.3r++
run-name: "Generate Swagger UI (RBP v2.2 Compliant)"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "openapi/**.yaml"

jobs:
  generate-swagger:
    name: 🧩 Generate Swagger UI Files
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repo
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Swagger Generator
        run: npm install -g redoc-cli

      - name: 🧠 Generate Reflective Swagger UI
        run: |
          mkdir -p docs/v573r++
          redoc-cli bundle openapi/main.yaml \
            -o docs/v573r++/index.html \
            --title "TUYUL FX AGI HYBRID API v5.7.3r++"
          echo "<!-- Reflective API v5.7.3r++ | RBP v2.2 -->" >> docs/v573r++/index.html
          echo "✅ Swagger UI generated successfully."

      - name: 💾 Commit Generated Swagger UI
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Generated Swagger UI — v5.7.3r++"
          file_pattern: "docs/v573r++/index.html"
          branch: main
