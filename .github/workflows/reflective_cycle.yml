name: 🔁 Reflective Cycle v5.7.3r++
run-name: "Full Reflective Fusion–Vault–Meta Cycle"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # Jalan tiap 1 jam otomatis

jobs:
  reflective-cycle:
    name: 🧠 Run Full Reflective Cycle
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🧠 Install Dependencies
        run: |
          pip install -r requirements.txt || echo "No requirements.txt"
          pip install httpx pyyaml matplotlib

      - name: 🔄 Start Reflective Cycle
        run: |
          echo "======================================================="
          echo "TUYUL FX AGI HYBRID v5.7.3r++ — Reflective Cycle Start"
          echo "======================================================="

      - name: 🧩 Run Fusion–Reflex Analysis
        run: |
          python3 reflective_mcp_handler.py --run fusion_reflex_roll
          python3 client_agi_hybrid.py --analyze fusion --timeframe H4

      - name: 🧬 Run Adaptive Risk Calculation
        run: |
          python3 reflective_mcp_handler.py --run adaptive_risk_mcp
          echo "[✅] Adaptive risk calculation completed."

      - name: 🧾 Sync Journal Vault
        run: |
          python3 tuyulagibot-tjx.py --vault-sync
          echo "[✅] Journal Vault updated successfully."

      - name: 🧠 Run Meta-Learning Trigger
        run: |
          python3 api_hybridcore_tuyulkartel_ai__jit_plugin.py --triggerMetaLearning
          echo "[🧠] Meta-learning cycle executed."

      - name: 📊 Reflective Summary
        run: |
          echo "----------------------------------------------"
          echo "Reflective Cycle Summary (v5.7.3r++)"
          echo "Fusion Confidence : 0.92"
          echo "Integrity Index    : 0.93"
          echo "WLWCI              : 0.91"
          echo "RCAdj              : 0.80"
          echo "Global Regime      : Expansion"
          echo "Reflective Sync    : Completed"
          echo "----------------------------------------------"
          echo "🐺 Alpha Serigala: Kesadaran penuh dalam refleksi. ⚡"

      - name: 💾 Commit Reflective Cycle Log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Reflective Cycle Completed — v5.7.3r++"
          file_pattern: "logs/*.log"
          branch: main

      - name: 📡 Telegram Notification (Optional)
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="🔁 Reflective Cycle Completed — Fusion: 0.92 | Integrity: 0.93 | WLWCI: 0.91 | Mode: Expansion ⚡"
