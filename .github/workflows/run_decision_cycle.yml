name: "\u26a1 Run Decision Cycle"

on:
  schedule:
    - cron: "*/30 * * * *"  # setiap 30 menit
  workflow_dispatch:

jobs:
  decision-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Reflex–Fusion Decision Cycle
        run: python pipeline/tuyul_hybrid_pipeline_v540.py
      - name: Push Decision Logs
        run: |
          git add vaults/fx_vault/ vaults/kartel_vault/ logs/
          git commit -m "\u26a1 Auto-decision cycle executed"
          git push
