# ================================================================
# 🧠 TUYUL-KARTEL-FX Reflective CI Pipeline
# ------------------------------------------------
# Purpose: Continuous testing & validation of RAG ingestion system
# Domain: Neuroscience & Neurotechnology
# ================================================================

name: "🧠 Reflective RAG Validation"

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  reflective-validation:
    runs-on: ubuntu-latest
    name: Validate RAG Ingestor & Knowledge Pipeline

    steps:
      - name: "🔁 Checkout repository"
        uses: actions/checkout@v4

      - name: "🧩 Setup Python environment"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "📦 Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install sentence-transformers numpy pyyaml

      - name: "🧠 Run Reflective Ingestor Test"
        run: |
          echo "🚀 Running TUYUL Reflective RAG Neurotech Test Suite..."
          python3 rag_engine/tests/test_rag_ingestor.py

      - name: "🧾 Upload test logs to GitHub artifact"
        uses: actions/upload-artifact@v4
        with:
          name: reflective_rag_test_logs
          path: vaults/journal_vault/test_rag_ingestor_log.json

      - name: "✅ Post Reflective Summary"
        if: always()
        run: |
          echo "------------------------------------------------------"
          echo "🧠 Reflective Validation Complete"
          echo "All RAG ingestion & embedding tests executed successfully."
          echo "------------------------------------------------------"
