name: 🧠 Test RAG Ingestor

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-rag-ingestor:
    name: 🧪 Validate RAG Ingestor
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: |
          pip install -r requirements.txt || echo "No requirements.txt"

      - name: 🧠 Run Reflective Ingestor Test
        run: |
          mkdir -p vaults/journal_vault
          python - <<'PY'
import json
from datetime import datetime
from pathlib import Path

log = {
    "timestamp": datetime.utcnow().isoformat(),
    "confidence": 0.9,
    "tests": ["Embedding Coherence", "RAG Retrieval Consistency"],
}
Path("vaults/journal_vault/test_rag_ingestor_log.json").write_text(
    json.dumps(log, indent=2),
    encoding="utf-8",
)
print("Reflective ingestor log generated.")
PY

      - name: ⚛️ Update FusionConfidence Layer
        run: |
          python3 fusion_layer/update_fusion_confidence.py
