name: "\U0001F9EC Trigger Meta-Learning Cycle"

on:
  schedule:
    - cron: "0 */8 * * *"  # Setiap 8 jam
  workflow_dispatch:

jobs:
  meta-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Meta-Learning Reflective Trainer
        run: python core/reflective/reflection_trainer.py
      - name: Commit Updated Reflective Params
        run: |
          git add configs/reflective_params.yaml
          git commit -m "\U0001F9EC Meta-learning reflective parameter update"
          git push
