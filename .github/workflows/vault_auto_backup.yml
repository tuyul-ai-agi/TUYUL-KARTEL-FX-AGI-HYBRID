name: "\U0001F4BE Vault Auto Backup"

on:
  schedule:
    - cron: "0 2 * * *"  # Setiap jam 2 pagi
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Backup Branch
        run: |
          git checkout -B vault-backup
          mkdir -p backups/
          cp -r vaults backups/$(date +'%Y%m%d_%H%M')
          git add backups/
          git commit -m "\U0001F4BE Daily Vault Backup - $(date)"
          git push origin vault-backup --force
