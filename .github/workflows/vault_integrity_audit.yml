name: "\U0001F50D Vault Integrity Audit"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Vault Integrity Checker
        run: python core/vaults/vault_integrity_checker.py
      - name: Push Audit Report
        run: |
          git add logs/vault_sync.log
          git commit -m "\U0001F50D Vault integrity audit completed"
          git push
