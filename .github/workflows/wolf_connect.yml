name: 🧠🐺 Wolf Reflective Connect v5.4.1-H

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"  # 🔁 jalan otomatis setiap 1 jam

jobs:
  wolf-connect:
    name: "TUYUL Hybrid Reflective Loop Sync"
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Ambil repo TUYUL Boss
      - name: 🧩 Checkout Repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Python environment
      - name: ⚙️ Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 3️⃣ Install dependensi utama
      - name: 📦 Install dependencies
        run: |
          pip install requests pandas python-dotenv

      # 4️⃣ Jalankan Wolf Reflective Loop
      - name: 🧠 Run Wolf Reflective Loop
        env:
          GITHUB_TOKEN: ${{ secrets.WOLF_TOKEN }}
          GITHUB_USER: tjx578
          GITHUB_REPO: TUYUL-KARTEL-FX-AGI-HYBRID
          WOLF_MODE: "hybrid-reflective"
        run: |
          echo "🔁 Running Wolf Reflective Sync Loop..."
          echo "🐺 Using secure token for GitHub connection"
          python wolf_reflective_loop.py
          echo "✅ Loop execution finished"

      # 5️⃣ Jalankan Diagnostic Bridge
      - name: 🧩 Wolf GitHub Bridge Diagnostics
        env:
          GITHUB_TOKEN: ${{ secrets.WOLF_TOKEN }}
          GITHUB_USER: tjx578
          GITHUB_REPO: TUYUL-KARTEL-FX-AGI-HYBRID
        run: |
          echo "🔍 Running bridge diagnostics..."
          python wolf_github_bridge.py

      # 6️⃣ Commit hasil reflektif (opsional)
      - name: 📘 Commit Reflective Data
        run: |
          git config user.name "TuyulWolfBot"
          git config user.email "bot@tuyulwolf.ai"
          git add -A
          git commit -m "Auto reflective sync $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.WOLF_TOKEN }}@github.com/${{ env.GITHUB_USER }}/${{ env.GITHUB_REPO }}.git main

      # 7️⃣ Output Status
      - name: ✅ Confirm Sync
        run: echo "Reflective sync completed successfully 🧠🐺"
