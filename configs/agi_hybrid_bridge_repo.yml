# ===============================================================
# ⚙️ AGI Hybrid Bridge Repo Configuration (v5.7.3r++)
# TUYUL FX AGI HYBRID – Quad Repo Reflective System
# ===============================================================
version: v5.7.3r++
system_mode: "adaptive_reflective"
bridge_protocol: "RBP v2.2"
auto_heal: true
reflective_loop_interval_sec: 3600
integrity_threshold: 0.92
coherence_minimum: 0.9

# ===============================================================
# 🔗 Repo Synchronization Paths
# ===============================================================
repos:
  hybrid_repo:
    path: "../repos/hybrid_repo/"
    description: "Analitik reflektif utama (TRQ, RGO, Fusion)"
    sync: true

  knowledge_repo:
    path: "../repos/knowledge_repo/"
    description: "Meta-learning dan coherence pattern reflektif"
    sync: true

  kartel_repo:
    path: "../repos/kartel_repo/macro_context_cache.json"
    description: "Makro global (VIX, RVI, Global Regime)"
    sync: true

  journal_repo:
    path: "../repos/journal_repo/reflective_log.json"
    description: "Catatan hasil reflektif adaptif"
    sync: true

# ===============================================================
# 🧩 Reflective Bridge Parameters
# ===============================================================
reflective_bridge:
  use_redis: true
  redis_host: "localhost"
  redis_port: 6379
  redis_channels:
    - hybrid_sync
    - knowledge_update
    - kartel_broadcast
    - journal_commit
  redis_heartbeat_sec: 60

# ===============================================================
# 🧠 Integrity & Monitoring
# ===============================================================
integrity_monitor:
  active: true
  refresh_rate_sec: 120
  alert_on_drop: true
  notify_channels:
    - "discord_webhook"
    - "telegram_bot"
  alert_threshold: 0.85

# ===============================================================
# 🧾 Reflective Metadata
# ===============================================================
metadata:
  author: "TUYUL LABS – Reflective Systems Division"
  maintainer: "tuyulbot-tjx"
  last_update: "2025-12-13"
  description: >
    Konfigurasi sinkronisasi reflektif adaptif untuk AGI Hybrid Core.
    Digunakan oleh Reflective Bridge untuk menjaga integritas Quad Repo
    dalam siklus reflektif otomatis setiap 60 menit.

# ===============================================================
# 🔍 Perbedaan dari Versi Lama
# ===============================================================
Aspek\tLama (v5.7.8)\tBaru (v5.7.3r++)
Terminologi\tvault_path\t✅ repo_path (per repo)
Struktur\t1 file path\t✅ 4 repo sinkron adaptif
Interval\tsync_interval_seconds\t✅ reflective_loop_interval_sec
Bridge\tstatic\t✅ Redis + Adaptive Bridge Protocol (RBP v2.2)
Integrity\tthreshold 0.9\t✅ integrity_threshold 0.92 + coherence_minimum
Metadata\ttidak ada\t✅ lengkap (author, maintainer, description)
Alert\t❌\t✅ Sistem alert via Discord / Telegram
Mode\t“adaptive”\t✅ “adaptive_reflective”

# ===============================================================
# 🧠 Cara Pakai di Sistem TUYULBOT–TJX
# ===============================================================
import yaml


def load_bridge_config(path="configs/agi_hybrid_bridge_repo.yml"):
    with open(path, "r") as f:
        return yaml.safe_load(f)


config = load_bridge_config()
print(config["repos"]["journal_repo"]["path"])

# Output:
#
# ../repos/journal_repo/reflective_log.json

