vault_name: FX_Vault
description: >
  Primary market data vault for reflex and fusion layers.
  Stores live feed, fusion journals, and volatility metrics.

endpoint:
  base_url: "https://api.fxvault.tuyulkartel.ai"
  auth_token: "${FX_VAULT_TOKEN}"
  timeout: 30

data_paths:
  fusion_journal: "vaults/fx_vault/fusion_journal.json"
  live_feed: "vaults/fx_vault/live_feed.json"
  bias_report: "vaults/fx_vault/reflective_bias_report.json"

sync_policy:
  auto_sync: true
  interval_minutes: 60
  sync_method: "push-pull"

backup:
  enabled: true
  location: "backups/fx_vault/"
  retention_days: 7
