version: '3.9'

services:
  # 🧠 HYBRID CORE — Otak utama reasoning
  hybrid-core:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tuyul_hybrid_core
    command: python main.py
    ports:
      - "8000:8000"
    restart: on-failure
    volumes:
      - .:/app
      - ./vaults:/app/vaults
      - ./knowledge:/app/knowledge
      - ./logs:/app/logs
    environment:
      - ENV_PROFILE=production
      - REFLECTIVE_BRIDGE_VERSION=RBP_v2.2
      - ENABLE_VAULT_SYNC=true
      - ENABLE_KNOWLEDGE_FEED=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - reflective-loop
      - vix-watcher
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 🔁 REFLECTIVE LOOP — Meta-learning cycle adaptif (tiap 1 jam, auto adjust)
  reflective-loop:
    build:
      context: .
      dockerfile
