version: "3.9"

x-common-env: &common-env
  REDIS_HOST: redis_reflective_bus
  REDIS_PORT: 6379
  BRIDGE_PROTOCOL: "RBP v2.2"
  REFLECTIVE_MODE: "adaptive_sync"

services:
  redis_bridge:
    image: redis:7
    container_name: redis_reflective_bridge
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      - REDIS_APPENDONLY=yes
      - REDIS_MAXMEMORY=512mb
    volumes:
      - redis_data:/data
    networks:
      - reflective_net

  hybrid_core:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tuyul_fx_core
    restart: always
    environment:
      - MODE=reflective
      - VERSION=5.7.8
      - BRIDGE_PROTOCOL=RBP_v2.2
    command:
      - sh
      - -c
      - python3 core/core_reflective_boot.py && python3 core/reflective_loop_handler.py
    volumes:
      - hybrid_logs:/app/logs
    networks:
      - reflective_net
    depends_on:
      - redis_bridge
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  knowledge_repo:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tuyul_knowledge_repo
    working_dir: /app
    command: ["python3", "src/knowledge_listener.py"]
    volumes:
      - ./knowledge_repo:/app
      - knowledge_logs:/app/logs
    networks:
      - reflective_net
    depends_on:
      - redis_bridge

  kartel_repo:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tuyul_kartel_repo
    working_dir: /app
    command: ["python3", "src/macro_broadcast.py"]
    environment:
      - MACRO_MODE=active
    volumes:
      - ./kartel_repo:/app
      - kartel_logs:/app/logs
    networks:
      - reflective_net
    depends_on:
      - redis_bridge

  journal_repo:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tuyul_journal_repo
    working_dir: /app
    command: ["python3", "src/journal_listener.py"]
    environment:
      - AUTO_ARCHIVE=true
      - ARCHIVE_INTERVAL_HOURS=12
    volumes:
      - ./journal_repo:/app
      - journal_logs:/app/logs
    networks:
      - reflective_net
    depends_on:
      - redis_bridge

  tuyulbot_tjx:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tuyulagibot_tjx
    restart: unless-stopped
    command: ["python3", "bots/tuyulagibot-tjx.py"]
    environment:
      - BOT_PERSONALITY=alpha_serigala
      - REFLECTIVE_MODE=adaptive
    networks:
      - reflective_net
    depends_on:
      - redis_bridge
      - hybrid_core
      - knowledge_repo
      - kartel_repo
      - journal_repo
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f tuyulagibot_tjx || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

  reflective_sync_controller:
    build:
      context: .
      dockerfile: dockerfile
    container_name: reflective_sync_controller
    restart: unless-stopped
    command: ["python3", "core/reflective_sync_controller.py"]
    networks:
      - reflective_net
    depends_on:
      - redis_bridge

  # ---------------------------------------------------------------
  # 🔌 Redis Reflective Bridge – Pusat Komunikasi Quad Repo
  # ---------------------------------------------------------------
  redis_reflective_bus:
    image: redis:7.2
    container_name: tuyul_reflective_bus
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # 🧠 Hybrid Core – Otak utama reflektif (Layer 9–12)
  # ---------------------------------------------------------------
  hybrid_core:
    build: .
    container_name: tuyul_fx_agi_hybrid_core
    restart: always
    environment:
      <<: *common-env
      MODE: reflective
      REPO_ROLE: hybrid
    command: >
      bash -c "
      python3 core/core_reflective_boot.py &&
      python3 core/reflective/reflective_loop_handler.py
      "
    depends_on:
      - redis_reflective_bus
    volumes:
      - ./core:/app/core
      - ./configs:/app/configs
      - ./utils:/app/utils
      - ./logs:/app/logs

  # ---------------------------------------------------------------
  # 📘 Knowledge Repo – Memori adaptif (Heuristic & Meta-learning)
  # ---------------------------------------------------------------
  knowledge_repo:
    build: .
    container_name: tuyul_fx_knowledge_repo
    restart: always
    environment:
      <<: *common-env
      REPO_ROLE: knowledge
    command: >
      bash -c "
      python3 core/repo/knowledge_sync_daemon.py
      "
    depends_on:
      - redis_reflective_bus
    volumes:
      - ./core:/app/core
      - ./configs:/app/configs
      - ./logs:/app/logs

  # ---------------------------------------------------------------
  # 🧩 Kartel Repo – Sumber data makro global (VIX, RVI, Regime)
  # ---------------------------------------------------------------
  kartel_repo:
    build: .
    container_name: tuyul_fx_kartel_repo
    restart: always
    environment:
      <<: *common-env
      REPO_ROLE: kartel
    command: >
      bash -c "
      python3 core/repo/kartel_macro_bridge.py --sync-loop
      "
    depends_on:
      - redis_reflective_bus
    volumes:
      - ./core:/app/core
      - ./configs:/app/configs
      - ./logs:/app/logs

  # ---------------------------------------------------------------
  # 🧾 Journal Repo – Vault sinkronisasi reflektif akhir
  # ---------------------------------------------------------------
  journal_repo:
    build: .
    container_name: tuyul_fx_journal_repo
    restart: always
    environment:
      <<: *common-env
      REPO_ROLE: journal
    command: >
      bash -c "
      python3 core/journal/reflective_journal_sync.py
      "
    depends_on:
      - hybrid_core
      - redis_reflective_bus
    volumes:
      - ./core:/app/core
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ./vaults:/app/vaults

  # ---------------------------------------------------------------
  # 🤖 TUYULBOT-TJX – Orkestrator Reflektif & Bridge Controller
  # ---------------------------------------------------------------
  tuyulbot_tjx:
    build: .
    container_name: tuyul_fx_bot_tjx
    restart: always
    environment:
      <<: *common-env
      BOT_PERSONALITY: alpha_serigala
    command: >
      bash -c "
      python3 bots/tuyulagibot_tjx.py
      "
    depends_on:
      - hybrid_core
      - redis_reflective_bus
    volumes:
      - ./bots:/app/bots
      - ./logs:/app/logs
      - ./configs:/app/configs

  # ---------------------------------------------------------------
  # 🔄 Reflective Sync Controller – Integritas Quad Repo
  # ---------------------------------------------------------------
  reflective_sync_controller:
    build: .
    container_name: tuyul_reflective_sync
    restart: always
    environment:
      <<: *common-env
      BRIDGE_CONFIG: configs/redis_reflective_bridge.yml
    command: >
      bash -c "
      python3 core/bridge/reflective_bridge_runtime.py
      "
    depends_on:
      - redis_reflective_bus
    volumes:
      - ./core:/app/core
      - ./configs:/app/configs
      - ./logs:/app/logs

  # ---------------------------------------------------------------
  # 📊 Reflective Dashboard – Streamlit Real-Time Visualization
  # ---------------------------------------------------------------
  reflective_dashboard:
    build:
      context: .
      dockerfile: dockerfile
    container_name: reflective_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    working_dir: /app
    volumes:
      - ./:/app
    command:
      - streamlit
      - run
      - tools/reflective_dashboard.py
      - --server.port
      - "8501"
      - --server.headless
      - "true"
    networks:
      - reflective_net
    depends_on:
      - redis_bridge

  reflective_logger:
    image: alpine:latest
    container_name: reflective_logger
    command:
      - sh
      - -c
      - >-
        touch /logs/hybrid/reflective.log /logs/knowledge/reflective.log
        /logs/kartel/reflective.log /logs/journal/reflective.log &&
        tail -f /logs/hybrid/*.log /logs/knowledge/*.log /logs/kartel/*.log
        /logs/journal/*.log
    volumes:
      - hybrid_logs:/logs/hybrid
      - knowledge_logs:/logs/knowledge
      - kartel_logs:/logs/kartel
      - journal_logs:/logs/journal
    networks:
      - reflective_net
    depends_on:
      - hybrid_core
      - knowledge_repo
      - kartel_repo
      - journal_repo

networks:
  reflective_net:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"

volumes:
  hybrid_logs:
  knowledge_logs:
  kartel_logs:
  journal_logs:
  redis_data:
    build: .
    container_name: tuyul_reflective_dashboard
    restart: always
    ports:
      - "8501:8501"
    command: >
      bash -c "
      streamlit run tools/reflective_dashboard.py --server.port 8501
      "
    depends_on:
      - hybrid_core
      - tuyulbot_tjx
    volumes:
      - ./tools:/app/tools
      - ./logs:/app/logs
      - ./configs:/app/configs

  # ---------------------------------------------------------------
  # 🧾 Log Forwarder – Central Reflective Logger
  # ---------------------------------------------------------------
  reflective_logger:
    image: busybox
    container_name: tuyul_reflective_logger
    restart: always
    command: >
      sh -c "tail -f /app/logs/*.log"
    volumes:
      - ./logs:/app/logs
