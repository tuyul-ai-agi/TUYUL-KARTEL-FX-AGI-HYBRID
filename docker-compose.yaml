version: '3.9'

services:
  hybrid-core:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tuyul_hybrid_core
    command: python main.py
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - ENV_PROFILE=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - reflective-loop

  reflective-loop:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tuyul_reflective_loop
    command: python pipeline/reflective_meta_cycle.py
    restart: always
    volumes:
      - .:/app
    environment:
      - REFLECTIVE_MODE=true
      - ENABLE_VAULT_SYNC=true
    ports:
      - "8501:8501"

  redis:
    image: redis:7
    container_name: tuyul_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  tuyul_data:
