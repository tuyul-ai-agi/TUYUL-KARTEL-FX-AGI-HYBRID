version: '3.9'

services:
  hybrid-core:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tuyul_hybrid_core
    command: python main.py
    ports:
      - "8000:8000"
    restart: on-failure
    volumes:
      - .:/app
      - ./vaults:/app/vaults
      - ./knowledge:/app/knowledge
      - ./logs:/app/logs
    environment:
      - ENV_PROFILE=production
      - REFLECTIVE_BRIDGE_VERSION=RBP_v2.2
      - ENABLE_VAULT_SYNC=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - reflective-loop
      - redis

  reflective-loop:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tuyul_reflective_loop
    command: python pipeline/reflective_meta_cycle.py
    restart: always
    volumes:
      - .:/app
      - ./vaults:/app/vaults
      - ./logs:/app/logs
    environment:
      - REFLECTIVE_MODE=true
      - ENABLE_VAULT_SYNC=true
      - ENABLE_JOURNAL_LOG=true
      - REFLECTIVE_BRIDGE_VERSION=RBP_v2.2
      - MONTECARLO_ITER=20000
      - MONTECARLO_DAYS=90
    ports:
      - "8501:8501"

  redis:
    image: redis:7
    container_name: tuyul_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - tuyul_data:/data

volumes:
  tuyul_data:
