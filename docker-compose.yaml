version: "3.9"

services:
  tuyul_agi_hybrid:
    build: .
    container_name: tuyul-agi-hybrid
    command: ["python", "main.py"]
    volumes:
      - .:/app
      - ./vaults:/app/vaults
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FX_VAULT_KEY=${FX_VAULT_KEY}
      - KARTEL_VAULT_KEY=${KARTEL_VAULT_KEY}
      - JOURNAL_VAULT_KEY=${JOURNAL_VAULT_KEY}
    ports:
      - "8000:8000"
    restart: always
    networks:
      - tuyul_net

networks:
  tuyul_net:
    driver: bridge
