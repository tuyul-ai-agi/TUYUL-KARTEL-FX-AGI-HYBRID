version: "3.9"

services:
  # ========================================================
  # 🔴 1️⃣ Redis Reflective Bridge Bus
  # ========================================================
  redis:
    image: redis:7.4-alpine
    container_name: tuyul_reflective_bus
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    networks:
      - tuyul_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ========================================================
  # 🌐 2️⃣ Data Bridge (Flask Proxy → TwelveData)
  # ========================================================
  data_bridge:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tuyul_data_bridge
    command: ["python", "clients/tuyul_data_bridge.py"]
    restart: always
    ports:
      - "8000:8000"
    environment:
      - TWELVEDATA_API_KEY=${TWELVEDATA_API_KEY}
      - BRIDGE_PORT=8000
    depends_on:
      - redis
    networks:
      - tuyul_network

  # ========================================================
  # 🧠 3️⃣ AGI Hybrid Orchestrator (Main Engine)
  # ========================================================
  agi_hybrid:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tuyul_agi_hybrid
    command: ["python", "main.py"]
    restart: always
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - TWELVEDATA_API_KEY=${TWELVEDATA_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Jakarta
    volumes:
      - ./logs:/app/logs
      - ./journal_repo:/app/journal_repo
      - ./knowledge:/app/knowledge
      - ./configs:/app/configs
    depends_on:
      - data_bridge
      - redis
    networks:
      - tuyul_network

  # ========================================================
  # 🧩 4️⃣ TUYULBOT-TJX Reflective BOT
  # ========================================================
  tuyulbot_tjx:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tuyulbot_tjx
    command: ["python", "bots/tuyulagibot-tjx.py"]
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - TWELVEDATA_API_KEY=${TWELVEDATA_API_KEY}
      - TZ=Asia/Jakarta
    volumes:
      - ./journal_repo:/app/journal_repo
      - ./logs:/app/logs
    depends_on:
      - agi_hybrid
      - redis
    networks:
      - tuyul_network

  # ========================================================
  # ⚙️ 5️⃣ Bridge Observer (Integrity Watchdog)
  # ========================================================
  observer:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tuyul_bridge_observer
    command: ["python", "ai_bridge/bridge_observer_v573r.py"]
    restart: always
    depends_on:
      - agi_hybrid
    networks:
      - tuyul_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://data_bridge:8000/bridge/status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

# ============================================================
# 🧭 NETWORK & VOLUMES
# ============================================================
networks:
  tuyul_network:
    driver: bridge

volumes:
  journal_repo:
  logs:
  knowledge:
  configs:
  data:
