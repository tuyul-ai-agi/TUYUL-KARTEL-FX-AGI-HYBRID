openapi: 3.0.3
info:
  title: TUYUL AGI Hybrid API
  version: 5.4.1
  description: >
    API specification untuk Reflex, Fusion, Reflective, dan Vault Sync.
servers:
  - url: https://api.tuyulkartel.ai/v1
paths:
  /api/reflex/run:
    post:
      summary: Jalankan Reflex Engine
      responses:
        '200':
          description: Reflex executed successfully
  /api/fusion/run:
    post:
      summary: Jalankan Fusion Layer 12
      responses:
        '200':
          description: Fusion run complete
  /api/reflective/run:
    post:
      summary: Jalankan Reflective Reasoning
      responses:
        '200':
          description: Reflective loop updated
