name: AGI Hybrid Sync
on:
  push:
    paths:
      - 'vaults/**'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Vaults
        run: python3 core/adapters/vault_bridge_client.py
      - name: Commit Changes
        run: |
          git config user.name "TUYUL AGI BOT"
          git add vaults/*
          git commit -m "🔄 Auto Sync Vaults"
          git push
