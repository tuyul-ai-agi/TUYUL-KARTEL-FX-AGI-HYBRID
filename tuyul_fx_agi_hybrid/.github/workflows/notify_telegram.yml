name: Notify Telegram
on:
  push:
    paths:
      - 'vaults/fusion_journal.json'
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send Notification
        run: |
          MESSAGE=$(jq -r '"PAIR: \(.pair)\nCONF₁₂: \(.conf12)\nWLWCI: \(.wlwci)\nRCAdj: \(.rcadj)"' vaults/fusion_journal.json)
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"$MESSAGE\"}" https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}
