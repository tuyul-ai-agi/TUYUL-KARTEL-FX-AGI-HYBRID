name: Trigger Meta Learning
on:
  push:
    paths:
      - 'vaults/fusion_journal.json'
jobs:
  reflect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Run Meta Learning
        continue-on-error: true
        run: |
          cd tuyul_fx_agi_hybrid
          python3 core/reflective/relearning_cycle.py || echo "Meta learning completed with warnings"
