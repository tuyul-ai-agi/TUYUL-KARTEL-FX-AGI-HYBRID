openapi: 3.1.0
info:
  title: TUYUL FX Hybrid - Risk & Vault API
  version: 5.4.0
paths:
  /risk/calculate:
    post:
      summary: Hitung risiko adaptif
      description: Menghitung risk 0.7–1% per trade berdasarkan balance & SL
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskRequest'
      responses:
        '200':
          description: Risk Output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskResponse'
  /vault/sync:
    post:
      summary: Sinkronisasi Vault (Hybrid ↔ Knowledge ↔ Journal)
      responses:
        '200':
          description: Sinkronisasi berhasil
components:
  schemas:
    RiskRequest:
      type: object
      properties:
        balance:
          type: number
        sl_pips:
          type: number
    RiskResponse:
      type: object
      properties:
        risk_percent:
          type: number
        lot_size:
          type: number
        rr_ratio:
          type: number
